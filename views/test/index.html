<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>和风天气测试</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      color: #253b3a;
      background: #edf2f1;
      --surface: #fff;
      --subtle: #f6f8f7;
      --line: #e2e9e6;
      --muted: #627572;
      --accent: #216758;
      --success: #26705b;
      --error: #a63e38;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; padding: 56px 24px; min-height: 100vh; }
    main { width: 100%; max-width: 580px; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 24px 4px; font-size: 14px; font-weight: 600; }
    .brand svg { width: 24px; height: 24px; color: var(--accent); }
    .brand span { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: auto; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
    .intro { padding: 32px 32px 26px; }
    .heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 600; margin: 0 0 10px; }
    h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -.6px; }
    .weather-icon { width: 84px; height: 68px; flex: none; }
    .description { color: var(--muted); font-size: 14px; line-height: 1.85; margin: 18px 0 0; }
    .settings { margin: 0 32px; padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .setting { display: flex; justify-content: space-between; gap: 18px; font-size: 13px; line-height: 1.7; }
    .setting + .setting { margin-top: 10px; }
    .setting dt { color: var(--muted); }
    .setting dd { margin: 0; text-align: right; }
    .actions { padding: 26px 32px 28px; }
    .feedback { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 22px; min-height: 54px; }
    .state-icon { width: 22px; height: 22px; flex: none; margin-top: 2px; color: var(--muted); }
    .state-icon path { stroke-linecap: round; stroke-linejoin: round; }
    .state-icon .check, .state-icon .cross, .state-icon .loading { display: none; }
    h2 { font-size: 14px; font-weight: 600; line-height: 1.7; margin: 0; }
    .hint { color: var(--muted); font-size: 13px; line-height: 1.8; margin: 4px 0 0; overflow-wrap: anywhere; }
    [data-state="success"] .state-icon, [data-state="success"] h2 { color: var(--success); }
    [data-state="error"] .state-icon, [data-state="error"] h2 { color: var(--error); }
    [data-state="success"] .idle, [data-state="error"] .idle, [data-state="loading"] .idle { display: none; }
    [data-state="success"] .check, [data-state="error"] .cross, [data-state="loading"] .loading { display: initial; }
    [data-state="loading"] .state-icon { animation: spin 1s linear infinite; color: var(--accent); }
    @keyframes spin { to { transform: rotate(360deg); } }
    button { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 48px; padding: 12px 20px; border: 1px solid transparent; border-radius: 10px; color: #fff; background: var(--accent); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s; }
    button svg { width: 16px; height: 16px; }
    button:hover { background: #194f44; }
    button:active { background: #123f36; }
    button:disabled { background: #526b65; cursor: wait; }
    button:focus-visible, summary:focus-visible { outline: 3px solid #69ac99; outline-offset: 4px; }
    .details { border-top: 1px solid var(--line); background: var(--subtle); }
    summary { cursor: pointer; padding: 17px 32px; font-size: 13px; color: var(--muted); }
    pre { margin: 0; border-top: 1px solid var(--line); padding: 20px 32px; max-height: 320px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.8 Consolas, monospace; }
    footer { margin-top: 20px; text-align: center; font-size: 12px; line-height: 1.8; color: var(--muted); }
    @media (max-width: 480px) {
      body { padding: 28px 16px; }
      .intro { padding: 26px 24px 22px; }
      .settings { margin: 0 24px; }
      .actions { padding: 24px; }
      summary, pre { padding-left: 24px; padding-right: 24px; }
      h1 { font-size: 23px; }
      .weather-icon { width: 66px; height: 56px; }
      .setting { font-size: 13px; }
    }
    @media (prefers-color-scheme: dark) {
      :root { color: #e2ebe7; background: #172421; --surface: #202f2b; --subtle: #1c2925; --line: #354740; --muted: #a2b5ac; --accent: #78c3a8; --success: #8bd6b4; --error: #ffaaa1; }
      button { color: #142e25; }
      button:hover { background: #9bdac3; }
      button:active { background: #66ae94; }
      button:disabled { background: #9cb7ad; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 14h12a4 4 0 1 0-3.7-5.5A5 5 0 0 0 3 11" stroke-linecap="round"/><path d="M3 18h13M7 22h5" stroke-linecap="round"/></svg>
      和风天气 <span>AstrBot 插件</span>
    </div>
    <section class="card" aria-labelledby="title" data-state="idle" id="test-card">
      <div class="intro">
        <div class="heading">
          <div><p class="eyebrow">配置验证</p><h1 id="title">天气查询测试</h1></div>
          <svg class="weather-icon" viewBox="0 0 90 72" fill="none" aria-hidden="true">
            <circle cx="61" cy="25" r="13" fill="#f2cf7c"/>
            <g stroke="#c6973b" stroke-width="1.5" stroke-linecap="round"><path d="M61 4V1M61 49v-3M82 25h4M37 25h3M76 10l3-3M76 40l3 3M46 10l-3-3"/></g>
            <path d="M24 59h39a12 12 0 0 0 0-24h-1a18 18 0 0 0-34-5 15 15 0 0 0-4 29Z" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
            <path d="M23 65h24M53 65h7" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="description">一键确认天气服务是否可用。使用已保存的插件配置，发起一次真实的当前天气查询。</p>
      </div>
      <dl class="settings">
        <div class="setting"><dt>使用配置</dt><dd>已保存的 API 域名与密钥</dd></div>
        <div class="setting"><dt>查询城市</dt><dd>默认城市 · 未设置时为北京</dd></div>
      </dl>
      <div class="actions">
        <div class="feedback" role="status" aria-live="polite" aria-atomic="true">
          <svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <g class="idle"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>
            <g class="check"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></g>
            <g class="cross"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/></g>
            <path class="loading" d="M21 12a9 9 0 1 1-9-9"/>
          </svg>
          <div><h2 id="status">等待测试</h2><p class="hint" id="status-hint">点击下方按钮，检查连接并获取天气结果。</p></div>
        </div>
        <button id="test-button" type="button">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m7 4 8 6-8 6V4Z" stroke-linejoin="round"/></svg>
          <span id="button-label">开始测试</span>
        </button>
      </div>
      <details id="result-details" class="details" hidden>
        <summary>查看原始查询结果</summary>
        <pre id="result"></pre>
      </details>
    </section>
    <footer>测试不会修改插件配置，也不会发送聊天消息。</footer>
  </main>
  <script type="module">
    const button = document.getElementById('test-button');
    const label = document.getElementById('button-label');
    const card = document.getElementById('test-card');
    const status = document.getElementById('status');
    const hint = document.getElementById('status-hint');
    const result = document.getElementById('result');
    const details = document.getElementById('result-details');

    button.addEventListener('click', async () => {
      button.disabled = true;
      label.textContent = '正在测试…';
      card.dataset.state = 'loading';
      status.textContent = '正在连接天气服务';
      hint.textContent = '正在查询当前天气，请稍候。';
      details.hidden = true;
      details.open = false;
      result.textContent = '';
      try {
        const bridge = window.AstrBotPluginView || window.AstrBotPluginPage;
        if (!bridge) throw new Error('请从 AstrBot 控制台的插件详情中打开测试视图。');
        await bridge.ready();
        const data = await bridge.apiPost('test-query', { when: 'now', focus: 'general' });
        card.dataset.state = data.success ? 'success' : 'error';
        status.textContent = data.success ? '测试成功' : '测试未通过';
        hint.textContent = data.success ? '已成功获取当前天气，天气查询服务可用。' : '请检查插件配置，展开原始结果查看具体原因。';
        result.textContent = JSON.stringify(data.result || data, null, 2);
        details.hidden = false;
      } catch (error) {
        card.dataset.state = 'error';
        status.textContent = '连接失败';
        hint.textContent = error.message;
      } finally {
        button.disabled = false;
        label.textContent = '重新测试';
      }
    });
  </script>
</body>
</html>
