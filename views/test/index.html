<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>和风天气测试</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 24px; }
    main { max-width: 720px; margin: 24px auto; }
    h1 { font-size: 24px; }
    p { line-height: 1.6; }
    button { min-height: 44px; padding: 10px 24px; cursor: pointer; font: inherit; }
    button:disabled { cursor: wait; }
    pre { padding: 16px; border: 1px solid #888; border-radius: 6px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>和风天气测试</h1>
    <p>使用插件已保存的域名和密钥，查询默认城市的当前天气。未设置默认城市时查询北京。</p>
    <button id="test-button" type="button">开始测试</button>
    <p id="status" role="status" aria-live="polite">点击按钮开始测试。</p>
    <pre id="result" hidden></pre>
  </main>
  <script>
    const button = document.getElementById('test-button');
    const status = document.getElementById('status');
    const result = document.getElementById('result');

    button.addEventListener('click', async () => {
      button.disabled = true;
      status.textContent = '测试中…';
      result.hidden = true;
      result.textContent = '';
      try {
        const response = await fetch('/api/plug/astrbot_plugin_qweather_tool/test-query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ when: 'now', focus: 'general' })
        });
        if (!response.ok) throw new Error(`请求失败（HTTP ${response.status}）`);
        const data = await response.json();
        status.textContent = data.success ? '测试成功。' : '测试未通过，请查看下方结果。';
        result.textContent = JSON.stringify(data.result || data, null, 2);
        result.hidden = false;
      } catch (error) {
        status.textContent = `测试失败：${error.message}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
